# bundle patch for the dsh-peer-link plugin: inserts its plugin row into the
# dsh profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/dsh-peer-link`.
- insert:
    - id: peer-link
      name: '@deepseek-ai/dsh-peer-link'
